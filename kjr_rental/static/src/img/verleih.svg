<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Materialverleih">
  <title>Materialverleih</title>
  <!-- Gleiches Motiv wie das App-Icon (Anhaenger mit Zugdeichsel) und dieselbe
       Markenfarbe #5E3F56. Das App-Icon entsteht aus tools/icons/build_icons.py
       (motiv_rental); wer dort das Motiv aendert, zieht diese Datei mit nach.
       64x64 wie die Portalsymbole von Odoo 19 (addons/portal/static/src/img/).
       Das Symbol ist kundensichtbar: portal.portal_docs_entry_layout
       ("Use Pictograms") ist standardmaessig aktiv und nimmt das d-none wieder weg.
       Die Koordinaten sind so gelegt, dass das Motiv samt Strichstaerke mittig
       im Feld steht (Rand links 4,4 / rechts 4,9 / oben 13,4 / unten 12,9). -->
  <g fill="none" stroke="#5E3F56" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18.5" y="15" width="39" height="23" rx="3"/>
    <path d="M18.5 23h39"/>
    <path d="M19.5 38.5 11.5 44"/>
    <circle cx="9" cy="45.5" r="3"/>
    <circle cx="27.5" cy="44" r="5.5"/>
    <circle cx="48.5" cy="44" r="5.5"/>
  </g>
</svg>
